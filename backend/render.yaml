# Render.com — one-click backend deploy
# Dashboard: New → Blueprint → connect repo → select this file
# Or: New Web Service → Root Directory: backend → Start: npm start

services:
  - type: web
    name: abn-community-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_MODE
        value: supabase
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: PORT
        value: 10000
      # Set these in Render Dashboard → Environment (secrets):
      # JWT_SECRET, SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
      # ADMIN_EMAIL, ADMIN_PASSWORD (12+ chars, never admin123)
      # FRONTEND_URL, CORS_ORIGINS
      # IAP_VERIFY_MODE=trust-txid  # until real Apple/Google receipt verify is added
      # Never commit backend/.env — rotate any key that was pasted into chat or zip files
    